name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # Required to create GitHub Release and upload assets
  packages: write # Required to publish to GitHub Packages (npm.pkg.github.com)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to generate release notes from commits

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Check for publishing credentials
        run: |
          echo "GITHUB_TOKEN is automatically provided for GitHub Packages publication."
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Notice: NPM_TOKEN secret is not set. Publishing to public npm registry will be skipped."
          else
            echo "NPM_TOKEN secret is detected. Public npm registry will also be published."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run every test suite
        run: npm run test:all

      - name: Build Bilt
        run: npm run build

      - name: Verify package version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version (v$TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version check passed: v$TAG_VERSION"

      - name: Verify required files exist before publishing
        run: |
          MISSING_FILES=0
          for file in README.md LICENSE bin/bilt.js dist/cli.js; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing."
              MISSING_FILES=1
            fi
          done
          if [ "$MISSING_FILES" -eq 1 ]; then
            exit 1
          fi
          echo "All required files exist."

      - name: Configure GitHub Packages authentication
        run: |
          echo "@samuel-0228:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (@samuel-0228/bilt-toolkit)
        run: |
          node scripts/package-registry.js github
          npm pack
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@samuel-0228/bilt-toolkit@$PKG_VERSION" --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "Notice: @samuel-0228/bilt-toolkit@$PKG_VERSION is already published to GitHub Packages. Skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack for npm registry (bilt-toolkit)
        run: |
          node scripts/package-registry.js npm
          npm pack

      - name: Publish to public npm (bilt-toolkit)
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "bilt-toolkit@$PKG_VERSION" --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "Notice: bilt-toolkit@$PKG_VERSION is already published to npm. Skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to public npm (@samuel-0228/bilt-toolkit)
        if: env.NPM_TOKEN != ''
        run: |
          node scripts/package-registry.js npm-scoped
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@samuel-0228/bilt-toolkit@$PKG_VERSION" --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "Notice: @samuel-0228/bilt-toolkit@$PKG_VERSION is already published to scoped npm. Skipping."
          else
            npm publish --@samuel-0228:registry=https://registry.npmjs.org --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Restore original package.json
        if: always()
        run: node scripts/package-registry.js restore

      - name: Create or update GitHub Release with tarball assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            RELEASE_TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Target release tag: $RELEASE_TAG"
          echo "Release tarball assets to attach:"
          ls -la *.tgz

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading tarball assets..."
            gh release upload "$RELEASE_TAG" *.tgz --clobber
          else
            echo "Creating GitHub Release $RELEASE_TAG with release notes and tarball assets..."
            gh release create "$RELEASE_TAG" \
              *.tgz \
              --title "Release $RELEASE_TAG" \
              --generate-notes
          fi
