name: CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Build, Test & Pack Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 1. Clean Install
        run: npm ci

      - name: 2. Code Lint
        run: npm run lint

      - name: 3. Typecheck
        run: npx tsc --noEmit

      - name: 4. Build
        run: npm run build

      - name: 5. Complete Test Suite
        run: npm run test:all

      - name: 6. Enforce Coverage Thresholds
        run: npm run test:coverage

      - name: 7. Security Dependency Audit
        run: npm audit --audit-level=critical

      - name: 8. Package Build & Smoke Test
        run: |
          TARBALL=$(npm pack | tail -n 1)
          echo "Packed tarball: $TARBALL"
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/bilt --version
          ./node_modules/.bin/bilt --help
          cd "$GITHUB_WORKSPACE"
          rm -rf "$TMP_DIR" "$TARBALL"
